<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 · 坐标丢失 | Saltline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;
  background:#0b0d0f;color:#e8e4da;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-align:center;padding:24px;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 38%,rgba(255,179,71,.07),transparent 62%)}
.w{position:relative;max-width:420px}
.code{font:700 92px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:-.04em;color:#ffb347;opacity:.22;margin-bottom:-26px}
h1{font-size:19px;letter-spacing:.22em;font-weight:700;margin-bottom:14px}
p{font-size:13px;line-height:1.9;color:rgba(232,228,218,.52);margin-bottom:26px}
a{display:inline-block;padding:12px 30px;background:#ffb347;color:#14181b;
  text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.18em;
  transition:transform .15s,box-shadow .15s}
a:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,179,71,.28)}
.ln{position:absolute;left:50%;top:-34px;width:1px;height:20px;background:rgba(255,179,71,.4)}
</style>
</head>
<body>
<div class="w">
  <div class="code">404</div>
  <h1>坐标丢失</h1>
  <p>这条航道不在盐线图上。<br>可能是打错了地址，或者它已经被拆走了。</p>
  <a href="/">返回码头</a>
</div>
</body>
</html>
